---
# These tasks install domlogo

- name: Install python3 modules and imagemagick for domlogo
  apt:
    state: present
    pkg:
      - python3-tk
      - imagemagick

- name: Install domlogo
  copy:
    src: domlogo.py
    dest: "{{ DJ_DIR }}"
    owner: domjudge
    group: domjudge
    mode: 0755

- name: Install domlogo Python libraries
  synchronize:
    src: lib
    dest: /home/domjudge/.local/
    owner: false
    # The ownership tasks below change the group; don't reset it on every run.
    group: false
    use_ssh_args: true

# Not a specific python3.X directory: that version is outdated, and creating a
# directory inside lib/ changes its mtime, which the sync above then resets.
- name: Fix ownership of domlogo env
  file:
    path: "/home/domjudge/.local"
    recurse: true
    owner: domjudge
    group: domjudge

- name: Install domlogo images
  synchronize:
    src: images/
    dest: "{{ DJ_DIR }}/domlogo-files/"
    owner: false
    # The ownership tasks below change the group; don't reset it on every run.
    group: false
    use_ssh_args: true

- name: Fix ownership of domlogo images
  file:
    path: "{{ DJ_DIR }}/domlogo-files"
    recurse: true
    owner: domjudge
    group: domjudge

- name: Copy domlogo systemd unit file
  template:
    src: "domlogo.service.j2"
    dest: "/etc/systemd/system/domlogo.service"

- name: Enable and start domlogo
  systemd:
    name: domlogo
    enabled: true
    state: started