---
# These tasks perform fixes used on the ICPC image to the base system.

- name: Add NTP servers
  lineinfile:
    dest: /etc/systemd/timesyncd.conf
    regexp: '^#?NTP='
    line: "NTP=ntp1 ntp2"
  notify: Restart systemd timesyncd
  when: WF_RESTRICTED_NETWORK

- name: Re-order PXEboot
  command: efibootmgr -o {{ EFI_ORDER }}
  when: EFI_ORDER is defined

# The VS Code extension gallery container binds 127.0.0.5:443, which blocks nginx.
- name: Check for VS Code gallery service
  stat:
    path: /etc/systemd/system/container-vscgallery.service
  register: vscgallery_service

- name: Disable VS Code gallery service
  systemd:
    name: container-vscgallery
    state: stopped
    enabled: false
  when: vscgallery_service.stat.exists

- name: IPv6 nginx fixes
  block:
    - name: Create nginx directory before installation
      file:
        path: /etc/{{ item }}
        state: directory
        mode: '0755'
        group: root
        owner: root
      loop:
        - nginx
        - nginx/sites-enabled

    - name: Create nginx default without IPv6 listener
      copy:
        dest: /etc/nginx/sites-enabled/default
        mode: '0644'
        group: root
        owner: root
        content: ""
