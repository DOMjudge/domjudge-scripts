---
# These tasks install and configure a MySQL server

- name: Install mysql packages
  apt:
    state: present
    pkg:
      - mariadb-server
      - python3-mysqldb
      - mycli

- name: Copy in MySQL config
  copy:
    src: my.cnf
    dest: /root/.my.cnf
    mode: 0644
    owner: root
    group: root

- name: Create directory for systemd mysql settings
  file:
    path: /etc/systemd/system/mysql.service.d/
    state: directory
    group: root
    owner: root
    mode: 0755

- name: Update systemd so mysql has bigger limits
  copy:
    src: mysql.override.cnf
    dest: /etc/systemd/system/mysql.service.d/override.conf
    mode: 0644
    group: root
    owner: root
  register: mysql_systemd_override

- name: Add mysql config snippet to increase limits
  copy:
    src: mysql.domjudge.cnf
    dest: /etc/mysql/mariadb.conf.d/zz_domjudge.cnf
    mode: 0644
    owner: root
    group: root
  register: mysql_config_snippet

# Not a handler: mysql_replication depends on this role and is listed with a
# 'when' that is false without a replication password. The handler of that
# conditional instance is then the one that is used, and it is skipped, so the
# server kept running with its defaults (16M max_allowed_packet).
- name: Restart mysql to apply the new configuration
  systemd:
    name: mysql
    enabled: true
    state: restarted
    daemon_reload: true
  when: mysql_systemd_override is changed or mysql_config_snippet is changed

- name: Run pending handlers
  meta: flush_handlers

- name: Make sure mysql runs
  service:
    name: mysql
    state: started

- name: Create directory to store scripts & database dumps
  file:
    path: /home/domjudge/{{ item }}
    owner: domjudge
    group: domjudge
    state: directory
    mode: 0755
  loop:
    - db-dumps
    - bin

- name: Copy database dump/load scripts
  copy:
    src: "{{ item }}"
    dest: /home/domjudge/bin/{{ item }}
    owner: domjudge
    group: domjudge
    mode: 0755
  loop:
    - load-db
    - dump-db
